# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://wowchemy.com/docs/guide/language/

# Default language
en:
  languageCode: en-us
  # Uncomment for multi-lingual sites, and move English content into `en` sub-folder.
  contentDir: content/en

# Uncomment the lines below to configure your website in a second language.
zh:
  languageCode: zh-Hans
  contentDir: content/zh
  title: 宋爽 - 科学家
  params:
    # Per-language overrides. The English forms live in config/_default/params.yaml;
    # anything a zh visitor reads must be overridden here, or the English text
    # leaks onto the Chinese site (a plain `description:` key does not — the
    # theme reads marketing.seo.description).
    marketing:
      seo:
        description: 宋爽 —— 地理学博士后，研究社会-生态系统与人水关系。
    footer:
      copyright:
        notice: '© {year} 宋爽。本作品采用 {license} 许可。'
  menu:
    main:
      - name: 主页
        url: '#about'
        weight: 20
      - name: 论文
        url: '#featured'
        weight: 70
      - name: 项目
        url: '#projects'
        weight: 80
      - name: 团队
        url: 'https://github.com/SongshGeoLab'   # 外链，主题会自动加 target="_blank"
        weight: 90
      # GitHub / 博客 已并入左上品牌名的身份下拉（assets/js/brand-roles.js）。
      # 团队组织链接刻意留在顶部导航：它是给访客的去处，不属于那个身份下拉里的个人身份。
