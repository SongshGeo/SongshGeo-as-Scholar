# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 20
  - name: Publications
    url: '#featured'           # the section file is content/en/home/featured.md → id="featured"
    weight: 70
  - name: Projects
    url: '#projects'
    weight: 80
  - name: Lab
    url: 'https://github.com/SongshGeoLab'   # external → theme adds target="_blank" automatically
    weight: 90
  # - name: Gallery
  #   url: '#gallery'
  #   weight: 85
  # - name: Contact
  #   url: '#contact'
  #   weight: 110
  # GitHub / Blog moved to the brand identity dropdown (see assets/js/brand-roles.js).
  # The Lab org link stays here in the top nav on purpose — it is a destination for
  # visitors, not one of the personal identities in that dropdown.
